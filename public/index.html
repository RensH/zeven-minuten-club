<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4CB81B">
<title>Zeven Minuten Club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%234CB81B'/%3E%3Ctext x='24' y='34' font-family='Arial' font-weight='900' font-size='28' fill='white' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow app column — "jij"-kaart met grote knop bovenaan, daaronder het groepsklassement. Chunky 3D-knoppen. */
:root{
  --bg:#F4F8EF; --surface:#FFFFFF; --line:#E1E8DA; --fg:#24321F; --muted:#6B7A64;
  --green:#4CB81B; --green-deep:#3A9212; --green-soft:#E3F6D6;
  --flame:#FF8A1F; --flame-soft:#FFEBD6; --gold:#F5B700; --gold-deep:#C99300; --gold-soft:#FFF4CC;
  --sky:#1CA8E8; --sky-deep:#1287BE; --miss:#E9EEE4; --danger:#E5484D;
  --plum:#A560E8; --plum-soft:#F3E8FD; --wood:#C9A27A;
  --skin:#EDC3A5; --skin-far:#D9A887; --outfit:#1D211C; --outfit-far:#4A5147; --shoe:#1D211C; --hair:#1E1916; --tie:#E3E1DA;
  --display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121812; --surface:#1B231A; --line:#2B3628; --fg:#EAF2E4; --muted:#9AAA92;
  --green:#5BCB27; --green-deep:#3E9A15; --green-soft:#1F3517;
  --flame:#FF9A3C; --flame-soft:#3A2614; --gold:#FFC93A; --gold-deep:#B88A00; --gold-soft:#3A3010;
  --sky:#3DB8F0; --sky-deep:#1C86B5; --miss:#283126; --danger:#FF6B6F; --plum:#C08BFF; --plum-soft:#2E2140; --wood:#8A6A4A; --outfit:#E4EBDF; --outfit-far:#A9B4A3; --shoe:#E4EBDF; --hair:#A07A5E; --skin-far:#C99A7B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121812; --surface:#1B231A; --line:#2B3628; --fg:#EAF2E4; --muted:#9AAA92;
  --green:#5BCB27; --green-deep:#3E9A15; --green-soft:#1F3517;
  --flame:#FF9A3C; --flame-soft:#3A2614; --gold:#FFC93A; --gold-deep:#B88A00; --gold-soft:#3A3010;
  --sky:#3DB8F0; --sky-deep:#1C86B5; --miss:#283126; --danger:#FF6B6F; --plum:#C08BFF; --plum-soft:#2E2140; --wood:#8A6A4A; --outfit:#E4EBDF; --outfit-far:#A9B4A3; --shoe:#E4EBDF; --hair:#A07A5E; --skin-far:#C99A7B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--green);display:grid;place-items:center;
  box-shadow:0 4px 0 var(--green-deep);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;flex:none}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-weight:700;font-size:14px}

/* chunky button */
.btn{border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;
  background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green-deep)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--sky-deep)}
.btn.ghost{background:var(--surface);color:var(--muted);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:10px 14px;font-size:13px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:default}

.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px}

/* who am I */
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.who .label{width:100%;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:2px solid var(--line);
  background:var(--surface);font-weight:800;box-shadow:0 3px 0 var(--line)}
.chip[aria-pressed="true"]{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--surface));box-shadow:0 3px 0 var(--sky-deep)}
.chip.add{padding:8px 14px;color:var(--sky);border-style:dashed;box-shadow:none}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.joinform{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.joinform input{flex:1 1 180px;min-width:0;font:inherit;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.err{color:var(--danger);font-weight:700;font-size:14px;width:100%;margin:0}

/* hero */
.hero{display:flex;flex-direction:column;gap:18px;text-align:center;padding:24px 20px}
.hero .greet{font-size:15px;font-weight:800;color:var(--muted)}
.hero h2{font-size:30px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left}
.stat b{font-family:var(--display);font-size:28px;line-height:1;display:block}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat.flame b{color:var(--flame)} .stat.gold b{color:var(--gold-deep)}
:root[data-theme="dark"] .stat.gold b{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stat.gold b{color:var(--gold)}}
.stat svg{flex:none}
.bigbtn{font-size:19px;padding:18px 20px;border-radius:18px}
.done-banner{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--green-soft);color:var(--green-deep);
  border-radius:18px;padding:16px;font-family:var(--display);font-weight:800;font-size:20px}
:root[data-theme="dark"] .done-banner{color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .done-banner{color:var(--green)}}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.linkish{background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.day small{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase}
.dot{width:36px;height:36px;border-radius:50%;background:var(--miss);display:grid;place-items:center;border:3px solid transparent;transition:transform .15s}
.day.on .dot{background:var(--flame);box-shadow:0 3px 0 color-mix(in srgb,var(--flame) 60%,#000)}
.day.today .dot{border-color:var(--sky)}
.day.locked{cursor:default;opacity:.35}
.day:not(.locked):hover .dot{transform:scale(1.08)}
.dn{font-size:13px;font-weight:800;color:var(--muted)}
.weekbox{display:flex;flex-direction:column;gap:12px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wkinfo{display:flex;flex-direction:column;align-items:center;min-width:0}
.wkinfo b{font-family:var(--display);font-size:18px;line-height:1.1}
.wkinfo span{font-size:13px;font-weight:700;color:var(--muted)}
.navbtn{width:40px;height:40px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--line);
  font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--sky);display:grid;place-items:center;padding:0 0 3px}
.navbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.navbtn[disabled]{color:var(--line);cursor:default;box-shadow:none}
.hint{font-size:13px;color:var(--muted);font-weight:600;margin:0}

/* leaderboard */
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.sect-h h2{font-size:22px;font-weight:800}
.sect-h span{font-size:13px;font-weight:700;color:var(--muted)}
.board{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.member{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
.member.me{border-color:var(--sky)}
.rank{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);width:20px;text-align:center}
.member .av{width:42px;height:42px;font-size:20px;position:relative}
.member .av .ok{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:var(--green);border:2px solid var(--surface);display:grid;place-items:center}
.minfo{min-width:0;display:flex;flex-direction:column;gap:6px}
.mname{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.mname .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.badge{font-size:11px;font-weight:800;letter-spacing:.05em;padding:2px 8px;border-radius:999px;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px}
.badge.perfect{background:var(--gold-soft);color:var(--gold-deep)}
:root[data-theme="dark"] .badge.perfect{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.perfect{color:var(--gold)}}
.badge.pct{background:var(--miss);color:var(--muted)}
.strip{display:flex;gap:3px}
.strip i{width:10px;height:10px;border-radius:3px;background:var(--miss);flex:none}
.strip i.on{background:var(--flame)}
.strip i.pre{background:transparent;border:1.5px dashed var(--line)}
.strip i.fut{background:transparent;border:1.5px solid var(--line)}
.strip .gap{width:4px;flex:none}
.mstreak{display:flex;flex-direction:column;align-items:center;min-width:48px}
.mstreak b{font-family:var(--display);font-size:24px;line-height:1;color:var(--flame)}
.mstreak.cold b{color:var(--muted)}
.mstreak small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
@media (max-width:420px){.strip i{width:8px;height:8px}.member{gap:10px;padding:12px}.rank{display:none}.member{grid-template-columns:auto 1fr auto}}

.empty{text-align:center;color:var(--muted);font-weight:700;padding:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;font-weight:700;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* celebration + timer overlays */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:28px 22px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.panel h2{font-size:30px;font-weight:800}
.panel p{margin:0;color:var(--muted);font-weight:700}
.bigflame{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.bigstreak{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--flame)}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.timer-ring{position:relative;width:200px;height:200px;max-width:100%}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:56px}
.phase{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--green-soft);color:var(--green-deep)}
.phase.rest{background:color-mix(in srgb,var(--sky) 16%,var(--surface));color:var(--sky-deep)}
.exname{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.extip{font-size:14px;color:var(--muted);font-weight:600;max-width:32ch}
.progress{display:flex;gap:4px;width:100%}
.progress i{flex:1;height:8px;border-radius:4px;background:var(--miss)}
.progress i.on{background:var(--green)}
.progress i.cur{background:var(--flame)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);
  padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;max-width:calc(100% - 32px)}

/* poppetje */
.fig{display:block;width:100%;height:auto;overflow:visible}
.fig .part{stroke:none}
.fig .skin{fill:var(--skin)} .fig .skin.far{fill:var(--skin-far)}
.fig .outfit{fill:var(--outfit)} .fig .outfit.far{fill:var(--outfit-far)}
.fig .shoe{fill:var(--shoe)} .fig .shoe.far{fill:var(--outfit-far)}
.fig .hair{fill:var(--hair)} .fig .tie{fill:var(--tie)} .fig .ear{fill:var(--skin-far)}
.fig.front .skin.far{fill:var(--skin)} .fig.front .outfit.far{fill:color-mix(in srgb,var(--outfit) 86%,var(--outfit-far))} .fig.front .shoe.far{fill:var(--shoe)}
.fig .ground{stroke:var(--line);stroke-width:1}
.fig .shadow{fill:color-mix(in srgb,var(--fg) 8%,transparent)}
.fig .prop rect{fill:var(--wood)}

/* workout van vandaag */
.today{display:flex;flex-direction:column;gap:14px}
.today .sect-h{margin:0}
.focus{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.focus::-webkit-scrollbar{display:none}
.fchip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.fchip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green-deep);box-shadow:0 3px 0 var(--green-deep)}
:root[data-theme="dark"] .fchip[aria-pressed="true"]{color:var(--green)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fchip[aria-pressed="true"]{color:var(--green)}}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;cursor:pointer;background:none;border:0;padding:4px 0}
.switch .track{width:42px;height:26px;border-radius:999px;background:var(--miss);position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0003;transition:transform .15s}
.switch[aria-checked="true"] .track{background:var(--green)}
.switch[aria-checked="true"] .track::after{transform:translateX(16px)}
.exgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
@media (max-width:520px){.exgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.exc{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%;border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:6px 6px 8px;text-align:left;position:relative;min-width:0}
.exc:hover{border-color:color-mix(in srgb,var(--sky) 50%,var(--line))}
.exc .no{position:absolute;top:6px;left:8px;font-family:var(--display);font-weight:800;font-size:13px;color:var(--muted)}
.exc .nm{font-weight:800;font-size:12.5px;overflow-wrap:anywhere;hyphens:auto;line-height:1.2;min-height:2.4em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.cat-c{background:var(--flame)} .cat-l{background:var(--plum)} .cat-u{background:var(--sky)} .cat-k{background:var(--gold)}
.exc .cat{position:absolute;top:10px;right:10px}
.catlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted)}
.catlegend span{display:flex;align-items:center;gap:6px}
.todaybtns{display:flex;gap:10px;flex-wrap:wrap}
.todaybtns .btn{flex:1 1 180px}
.needs{font-size:13px;font-weight:700;color:var(--muted);margin:0}

/* oefening-uitleg */
.detail .fig{max-width:300px}
.detail .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--miss);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.easy{font-size:14px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.easy b{color:var(--fg)}

/* timer */
#timer{place-items:stretch;overflow-y:auto}
@media (max-height:720px){.tfig{max-width:230px}.tpanel{gap:8px;padding:14px}.exname{font-size:24px}}
.tpanel{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px 18px 20px;max-width:460px;width:100%;margin:auto;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.tpanel .top2{display:flex;align-items:center;gap:10px;width:100%}
.tpanel .progress{flex:1}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}
.tfig{width:100%;max-width:340px;border-radius:20px;background:var(--bg);padding:6px 8px 0}
.tfig.rest{background:color-mix(in srgb,var(--sky) 10%,var(--bg))}
.tinfo{display:flex;flex-direction:column;gap:6px;align-items:center}
.switchside{font-family:var(--display);font-weight:800;font-size:18px;color:var(--flame);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.tbottom{display:flex;align-items:center;justify-content:center;gap:16px;width:100%}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px}
.tctrl{display:flex;flex-direction:column;gap:8px}
.upnext{font-size:13px;font-weight:700;color:var(--muted)}

/* aftellen, muziek, beloning */
.tfig{position:relative}
.countbig{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:110px;line-height:1;color:var(--flame);pointer-events:none;opacity:0;text-shadow:0 4px 0 color-mix(in srgb,var(--flame) 40%,transparent)}
.countbig.go{animation:countpop .9s ease-out both}
@keyframes countpop{0%{opacity:0;transform:scale(1.8)}15%{opacity:1;transform:scale(1)}70%{opacity:.95}100%{opacity:0;transform:scale(.85)}}
.iconbtn.wide{width:auto;padding:0 10px;gap:6px;display:flex;align-items:center;font-weight:800;font-size:13px;color:var(--fg)}
.exen{font-size:13px;font-weight:700;color:var(--muted);margin-top:-4px}
.setrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.setl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:56px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.fchip.sm{padding:6px 12px;font-size:13px}
.results{gap:14px}
.results .small{font-size:13px}
.xpwin{display:flex;align-items:baseline;justify-content:center;gap:6px;color:var(--gold-deep)}
.xpwin b{font-family:var(--display);font-size:52px;line-height:1}
.xpwin span{font-weight:800;font-size:18px}
:root[data-theme="dark"] .xpwin{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xpwin{color:var(--gold)}}
.xpsplit{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:-8px}
.xpsplit span{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--gold-soft);color:var(--fg)}
.lvl{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}
.lvlh{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.lvlh b{color:var(--fg)}
.lvlbar{height:14px;border-radius:999px;background:var(--miss);overflow:hidden}
.lvlbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--flame))}
.lvlup{align-self:center;font-family:var(--display);font-weight:800;font-size:20px;color:var(--flame);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.rstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.rstats>div{border:2px solid var(--line);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.rstats b{font-family:var(--display);font-size:24px;line-height:1}
.rstats span{font-size:12px;font-weight:700;color:var(--muted)}
.badges{width:100%;display:flex;flex-direction:column;gap:8px;text-align:left}
.bh{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badge2{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.badge2 div{display:flex;flex-direction:column;min-width:0;flex:1}
.badge2 b{font-size:14px}
.badge2 span{font-size:12px;color:var(--muted);font-weight:600}
.badge2 em{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--flame);padding:2px 8px;border-radius:999px}
.badge.lv{background:color-mix(in srgb,var(--sky) 15%,var(--surface));color:var(--sky-deep)}
:root[data-theme="dark"] .badge.lv{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.lv{color:var(--sky)}}
#celebrate{overflow-y:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gate input{width:100%;font:inherit;font-weight:700;font-size:20px;text-align:center;letter-spacing:.1em;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true">7</div>
    <div>
      <h1>Zeven Minuten Club</h1>
      <p id="dateline">12 oefeningen · 30 sec werken · 10 sec rust</p>
    </div>
  </header>

  <section class="card who" id="who" aria-label="Wie ben jij">
    <div class="label">Wie ben jij?</div>
    <div id="chips" style="display:contents"></div>
  </section>

  <section class="card hero" id="hero" hidden></section>

  <section aria-labelledby="boardh">
    <div class="sect-h"><h2 id="boardh">Klassement</h2><span id="boardsub">Gesorteerd op streak</span></div>
    <ul class="board" id="board"><li class="empty">Laden…</li></ul>
    <div class="legend">
      <span><i style="background:var(--flame)"></i>Workout gedaan</span>
      <span><i style="background:var(--miss)"></i>Gemist</span>
      <span><i style="border:1.5px dashed var(--line)"></i>Nog niet lid</span>
      <span><i style="border:1.5px solid var(--line)"></i>Nog te komen</span>
    </div>
  </section>

  <section class="card today" id="today" aria-labelledby="todayh"></section>
</div>

<div class="overlay" id="celebrate" hidden></div>
<div class="overlay" id="timer" hidden></div>
<div class="overlay" id="detail" hidden></div>
<div class="overlay" id="gate" hidden>
  <form class="panel gate" id="gateform">
    <div class="logo" aria-hidden="true">7</div>
    <h2>Groepscode</h2>
    <p>Vul de code in die je van de groep hebt gekregen.</p>
    <input id="gatecode" autocomplete="off" autocapitalize="off" aria-label="Groepscode">
    <p class="err" id="gateerr" hidden>Die code klopt niet. Probeer het opnieuw.</p>
    <button class="btn" type="submit" style="width:100%">Doorgaan</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="oefeningen.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const COLORS = ["#1CA8E8","#CE82FF","#FF4B4B","#FF9600","#2B70C9","#00A88E","#E35A9E","#8A6CFF"];
const DAYS = ["zo","ma","di","wo","do","vr","za"];
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const WORK=30, REST=10, PREP=10;

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const todayKey = () => key(new Date());
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/864e5); }
const mondayOf = d => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const n=(x.getUTCDay()+6)%7; x.setUTCDate(x.getUTCDate()-n+3); const y=new Date(Date.UTC(x.getUTCFullYear(),0,4)); return 1+Math.round(((x-y)/864e5-3+((y.getUTCDay()+6)%7))/7); }
const MON = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
let weekOffset=0;

/* ---------- stats ---------- */
const isDone = (p,k) => !!(p.days && p.days[k] === true);
function stats(p){
  const t = todayKey(), start = p.start || t;
  const doneToday = isDone(p,t);
  let d = new Date(); if(!doneToday) d = addDays(d,-1);
  let streak = 0;
  while(isDone(p,key(d))){ streak++; d = addDays(d,-1); }
  let best=0, run=0, done=0;
  const span = Math.max(0,daysBetween(start,t));
  for(let i=0;i<=span;i++){
    const k = key(addDays(parse(start),i));
    if(isDone(p,k)){ run++; done++; best=Math.max(best,run); } else if(k!==t) run=0;
  }
  const counted = span + (doneToday?1:0);           // vandaag telt pas mee als hij gedaan is
  const missed = counted - done;
  const pct = counted ? Math.round(done/counted*100) : 100;
  return {streak,best,done,counted,missed,pct,doneToday,perfect: missed===0 && done>0};
}

/* ---------- state ---------- */
let db=null, people=[], me=null, canWrite=true;
try{ me = localStorage.getItem("zmc-me"); }catch(e){}
function setMe(id){ me=id; weekOffset=0; try{ id?localStorage.setItem("zmc-me",id):localStorage.removeItem("zmc-me"); }catch(e){} render(); }
let joining=false, joinErr="";

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial = n => esc((n||"?").trim().charAt(0).toUpperCase());
const colorOf = p => COLORS[(p.color ?? 0) % COLORS.length];
const flameSvg = (s=28,c="var(--flame)") => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path fill="${c}" d="M12 2c1 3.2-.6 5-2 6.6C8.6 10.2 7 12 7 14.6 7 18 9.3 21 12 21s5-2.7 5-6c0-2.3-1.1-4-2.3-5.2.1 1.6-.5 2.8-1.6 3.3.4-3.3-.4-7.2-1.1-11.1z"/><path fill="#FFD27A" d="M12 21c-1.7 0-3-1.5-3-3.3 0-1.6 1-2.6 2-3.6.2 1 .8 1.6 1.6 1.8-.1-1.2.3-2.2 1-3 .9 1 1.4 2.4 1.4 3.9 0 2.4-1.3 4.2-3 4.2z"/></svg>`;
const crownSvg = (s=28) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--gold)" d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 11H5z"/><rect x="5" y="19" width="14" height="2" rx="1" fill="var(--gold-deep)"/></svg>`;
const checkSvg = (s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3200); }

/* ---------- render ---------- */
function render(){
  const now=new Date();
  $("#dateline").textContent = ["Zondag","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"][now.getDay()]+" "+now.getDate()+" "+MONTHS[now.getMonth()]+" · 12 oefeningen in 7 minuten";
  if(me && !people.find(p=>p.id===me) && people.length) me=null;
  renderChips(); renderHero(); renderToday(); renderBoard();
}

function renderChips(){
  const el=$("#chips");
  if(!db){ el.innerHTML=`<p class="hint">Gegevens worden geladen…</p>`; return; }
  let h = people.map(p=>`<button class="chip" data-pick="${p.id}" aria-pressed="${p.id===me}"><span class="av" style="background:${colorOf(p)}">${initial(p.name)}</span>${esc(p.name)}</button>`).join("");
  if(joining){
    h += `<form class="joinform" id="joinform"><input id="joinname" maxlength="24" placeholder="Je voornaam" autocomplete="given-name" aria-label="Je naam"><button class="btn small" type="submit">Aanmelden</button><button class="btn ghost small" type="button" data-cancel>Annuleren</button>${joinErr?`<p class="err">${esc(joinErr)}</p>`:""}</form>`;
  } else if(canWrite){
    h += `<button class="chip add" data-join>+ Aanmelden</button>`;
  }
  el.innerHTML=h;
  if(joining){ const i=$("#joinname"); i && i.focus(); }
}

function renderHero(){
  const hero=$("#hero"); const p=people.find(x=>x.id===me);
  if(!p){ hero.hidden=true; return; }
  hero.hidden=false;
  const s=stats(p), t=todayKey();
  const start=p.start||t;
  const firstMon=mondayOf(parse(start)), thisMon=mondayOf(new Date());
  const maxBack=Math.round((thisMon-firstMon)/(7*864e5));
  weekOffset=Math.min(Math.max(weekOffset,0),maxBack);
  const mon=addDays(thisMon,-7*weekOffset), sun=addDays(mon,6);
  const week=[]; let wDone=0, wCount=0;
  for(let i=0;i<7;i++){
    const d=addDays(mon,i), k=key(d);
    const locked = k < start || k > t;
    if(!locked && k!==t || isDone(p,k)){ wCount++; }
    if(isDone(p,k)) wDone++;
    week.push(`<button class="day ${isDone(p,k)?"on":""} ${k===t?"today":""} ${locked?"locked":""}" data-toggle="${k}" ${locked?"disabled":""} aria-label="${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}: ${isDone(p,k)?"gedaan":"niet gedaan"}"><small>${k===t?"nu":DAYS[d.getDay()]}</small><span class="dot">${isDone(p,k)?checkSvg(16):`<span class="dn num">${d.getDate()}</span>`}</span></button>`);
  }
  const range = mon.getMonth()===sun.getMonth() ? `${mon.getDate()}–${sun.getDate()} ${MON[sun.getMonth()]}` : `${mon.getDate()} ${MON[mon.getMonth()]} – ${sun.getDate()} ${MON[sun.getMonth()]}`;
  const weekNav = `<div class="weeknav">
      <button class="navbtn" data-wk="1" ${weekOffset>=maxBack?"disabled":""} aria-label="Vorige week">‹</button>
      <div class="wkinfo"><b>${weekOffset===0?"Deze week":weekOffset===1?"Vorige week":"Week "+isoWeek(mon)}</b><span class="num">${weekOffset<2?"Week "+isoWeek(mon)+" · ":""}${range} · ${wDone}/${wCount||0} gedaan</span></div>
      <button class="navbtn" data-wk="-1" ${weekOffset===0?"disabled":""} aria-label="Volgende week">›</button>
    </div>`;
  const action = s.doneToday
    ? `<div class="done-banner">${checkSvg(22).replace('#fff','currentColor')} Workout van vandaag gedaan!</div>
       <div class="row2"><button class="linkish" data-undo>Toch niet gedaan? Ongedaan maken</button></div>`
    : `<button class="btn bigbtn" data-mark>Ik heb mijn workout gedaan</button>
       <div class="row2"><button class="btn sky small" data-start>Start de workout van vandaag</button></div>`;
  hero.innerHTML = `
    <div><div class="greet">Hoi ${esc(p.name)}!</div>
    <h2>${s.doneToday ? (s.streak>1?`${s.streak} dagen op rij. Top!`:"Goed begin!") : (s.streak? `Houd je streak van ${s.streak} vast` : "Tijd voor 7 minuten")}</h2></div>
    <div class="stats">
      <div class="stat flame">${flameSvg(34)}<div><b class="num">${s.streak}</b><span>dagen streak</span></div></div>
      <div class="stat gold">${s.perfect?crownSvg(34):`<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="12" cy="12" r="9" fill="none" stroke="var(--gold)" stroke-width="3" stroke-dasharray="${(s.pct/100*56.5).toFixed(1)} 56.5" transform="rotate(-90 12 12)" stroke-linecap="round"/></svg>`}<div><b class="num">${s.pct}%</b><span>${s.perfect?"niets gemist":s.missed+" "+(s.missed===1?"dag":"dagen")+" gemist"}</span></div></div>
    </div>
    ${(()=>{ const x=xpOf(p), L=levelOf(x); return `<div class="lvl"><div class="lvlh"><b>Level ${L.n} · ${L.title}</b><span class="num">${x} / ${L.hi} XP</span></div><div class="lvlbar"><i style="width:${(L.pct*100).toFixed(1)}%"></i></div></div>`; })()}
    ${action}
    <div class="weekbox">${weekNav}<div class="week">${week.join("")}</div></div>
    <p class="hint">Vergeten af te vinken? Tik op de dag. Met de pijlen blader je terug naar eerdere weken.</p>`;
}

function renderBoard(){
  const el=$("#board");
  if(!db){ el.innerHTML=`<li class="empty">${dbFailed?"De gegevens zijn nu niet bereikbaar. Controleer je internet en herlaad de pagina.":"Laden…"}</li>`; return; }
  if(!people.length){ el.innerHTML=`<li class="empty">Nog niemand aangemeld. Tik hierboven op “+ Aanmelden” en vul je naam in.</li>`; return; }
  const t=todayKey();
  const rows = people.map(p=>({p,s:stats(p)})).sort((a,b)=> b.s.streak-a.s.streak || b.s.pct-a.s.pct || b.s.done-a.s.done || a.p.name.localeCompare(b.p.name));
  const doneCount = rows.filter(r=>r.s.doneToday).length;
  $("#boardsub").textContent = `${doneCount} van ${rows.length} vandaag klaar`;
  el.innerHTML = rows.map((r,i)=>{
    const {p,s}=r; let strip="";
    const m0=addDays(mondayOf(new Date()),-7);
    for(let d=0;d<14;d++){ const k=key(addDays(m0,d)); strip+=(d===7?`<b class="gap"></b>`:"")+`<i class="${k>t?"fut":k<(p.start||t)?"pre":isDone(p,k)?"on":""}"></i>`; }
    return `<li class="member ${p.id===me?"me":""}">
      <span class="rank num">${i+1}</span>
      <span class="av" style="background:${colorOf(p)}">${initial(p.name)}${s.doneToday?`<span class="ok" title="Vandaag gedaan">${checkSvg(11)}</span>`:""}</span>
      <div class="minfo">
        <div class="mname"><span class="n">${esc(p.name)}</span><span class="badge lv num">Lv ${levelOf(xpOf(p)).n}</span>${s.perfect?`<span class="badge perfect">${crownSvg(12)}100%</span>`:`<span class="badge pct num">${s.pct}%</span>`}</div>
        <div class="strip" aria-label="Vorige en deze week, maandag tot zondag">${strip}</div>
      </div>
      <div class="mstreak ${s.streak?"":"cold"}">${flameSvg(22,s.streak?"var(--flame)":"var(--line)")}<b class="num">${s.streak}</b><small>${s.streak===1?"dag":"dagen"}</small></div>
    </li>`;
  }).join("");
}

/* ---------- actions ---------- */
function failWrite(e){
  if(e && e.code==="auth") return;
  if(e && e.message){ toast(e.message); return; }
  toast("Opslaan lukte niet. Controleer je internet en probeer het opnieuw.");
}
/* ---------- API (Netlify Function + Netlify Blobs) ---------- */
let groupCode=""; try{ groupCode=localStorage.getItem("zmc-code")||""; }catch(e){}
async function api(path,opts={}){
  let r;
  try{ r=await fetch("/api/"+path,Object.assign({},opts,{headers:{"content-type":"application/json","x-group-code":groupCode}})); }
  catch(e){ throw {code:"network"}; }
  if(r.status===401){ showGate(!!groupCode); throw {code:"auth"}; }
  const body=await r.json().catch(()=>({}));
  if(!r.ok) throw {code:"http",message:body.error};
  return body;
}
function showGate(wrong){ $("#gate").hidden=false; $("#gateerr").hidden=!wrong; const i=$("#gatecode"); i.value=""; i.focus(); }
let busy=false;
async function setDay(k,val){
  if(busy) return; busy=true;
  const p=people.find(x=>x.id===me); if(!p){busy=false;return;}
  const prev = p.days ? p.days[k] : undefined;
  p.days = Object.assign({},p.days,{[k]:val}); if(seenDone&&k===todayKey()){ val?seenDone.add(p.id):seenDone.delete(p.id); } render();
  try{ const upd=await api("people/"+encodeURIComponent(p.id)+"/day",{method:"POST",body:JSON.stringify({date:k,done:val})}); Object.assign(p,upd); }
  catch(e){ p.days = Object.assign({},p.days,{[k]:prev}); render(); failWrite(e); busy=false; return false; }
  busy=false; return true;
}
async function markToday(sum){
  const p=people.find(x=>x.id===me); if(!p) return;
  const xpBefore=xpOf(p), firstToday=!people.some(x=>x.id!==p.id && isDone(x,todayKey()));
  const ok = await setDay(todayKey(),true);
  if(ok!==false) celebrate(sum||null,false,xpBefore,firstToday);
}
function celebrate(sum, extra=false, xpBefore=null, firstToday=false){
  const p=people.find(x=>x.id===me); if(!p) return;
  const s=stats(p), xpNow=xpOf(p), xb=xpBefore==null?xpNow:xpBefore, gained=extra?0:xpNow-xb;
  const lvB=levelOf(xb), lv=levelOf(xpNow), up=lv.n>lvB.n;
  const badges=extra?[]:badgesFor(p,sum,firstToday);
  const t=todayKey(), doneN=people.filter(x=>isDone(x,t)).length, left=people.filter(x=>!isDone(x,t)).map(x=>x.name);
  const order=["","1e","2e","3e","4e","5e","6e","7e","8e"];
  const msgs=["Lekker bezig","Sterk werk","Zo doe je dat","Kampioen"];
  const mm=sum?`${Math.floor(sum.secs/60)}:${String(sum.secs%60).padStart(2,"0")}`:"";
  const ov=$("#celebrate");
  ov.innerHTML=`<div class="panel results" role="dialog" aria-modal="true" aria-labelledby="celh">
    <div class="bigflame">${trophySvg(84)}</div>
    <div><h2 id="celh">${extra?"Extra workout gedaan!":"Workout voltooid!"}</h2>
    <p>${msgs[Math.floor(Math.random()*msgs.length)]}, ${esc(p.name)}.</p></div>
    ${extra?`<p class="small">Vandaag stond al afgevinkt. Deze telt als extra training.</p>`:`
    <div class="xpwin"><b class="num" id="xpcount">+0</b><span>XP</span></div>
    <div class="xpsplit"><span>Workout +100</span>${gained>100?`<span>Streakbonus +${gained-100}</span>`:""}</div>`}
    <div class="lvl">
      <div class="lvlh"><b>Level <span id="lvln">${lvB.n}</span> · <span id="lvlt">${lvB.title}</span></b><span class="num" id="lvlx">${xb} / ${lvB.hi} XP</span></div>
      <div class="lvlbar"><i id="lvlfill" style="width:${(lvB.pct*100).toFixed(1)}%"></i></div>
      <div class="lvlup" id="lvlup" hidden>Level omhoog!</div>
    </div>
    <div class="rstats">
      <div>${flameSvg(26)}<b class="num">${s.streak}</b><span>${s.streak===1?"dag":"dagen"} op rij</span></div>
      ${sum?`<div><b class="num">${sum.total-sum.skipped}/${sum.total}</b><span>oefeningen</span></div><div><b class="num">${mm}</b><span>minuten</span></div>`:`<div><b class="num">${s.pct}%</b><span>score</span></div>`}
    </div>
    ${badges.length?`<div class="badges"><div class="bh">Nieuwe badges</div>${badges.map(b=>`<div class="badge2">${medalSvg}<div><b>${esc(b[0])}</b><span>${esc(b[1])}</span></div><em>Nieuw</em></div>`).join("")}</div>`:""}
    <p class="small">${extra?"":`Jij bent de ${order[doneN]||doneN+"e"} van ${people.length} vandaag.`} ${left.length?`Nog te gaan: ${left.map(esc).join(", ")}.`:"Iedereen is klaar vandaag!"}</p>
    <button class="btn" data-close style="width:100%">Doorgaan</button></div>`;
  ov.hidden=false; ov.querySelector("[data-close]").focus();
  fireConfetti();
  // XP optellen en levelbalk laten vollopen
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches, t0=performance.now(), dur=reduce?1:1400;
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3), x=Math.round(xb+gained*e), L=levelOf(x);
    const c=$("#xpcount"); if(c) c.textContent="+"+Math.round(gained*e);

// opbouw van een nummer: 4 delen van 8 maten, elke ronde een andere toonsoort
function arr(step,keys){ const bar=Math.floor(step/16); return {bar, s:step%16, sec:Math.floor(bar/8)%4, bIn:bar%8, tr:keys[Math.floor(bar/32)%keys.length]}; }
/* Energiek: een nummer van 32 maten dat steeds verandert:
   groove -> melodie -> opbouw met roffel en ruis -> drop. Elke ronde in een andere toonsoort. */
const E_PROG=[[[57,60,64],[53,57,60],[48,52,55],[55,59,62]], [[53,57,60],[55,59,62],[52,55,59],[57,60,64]]];
const E_LEAD=[[0,null,2,null,1,null,2,3,null,2,null,1,0,null,null,null],[2,null,2,3,null,2,1,null,0,null,1,2,null,1,0,null],[3,2,1,2,null,1,0,null,1,null,2,null,3,null,4,null]];
const E_KEYS=[0,3,-2,5];
function energyStep(st,step,t){
  const b16=60/st.bpm/4, bar=Math.floor(step/16), s=step%16, sec=Math.floor(bar/8)%4, bIn=bar%8, round=Math.floor(bar/32);
  const tr=E_KEYS[round%E_KEYS.length], prog=E_PROG[(sec===1||(sec===3&&bIn>=4))?1:0], ch=prog[bar%4].map(m=>m+tr), root=ch[0]-12;
  const fill = bIn%4===3 && s>=12;
  // drums
  if(sec!==2){
    if(s%4===0 && !fill) drum("kick",t);
    if((s===4||s===12) && !fill) drum("clap",t);
    if(fill) drum("snare",t);
  } else { // opbouw: kick vervalt aan het eind, roffel wordt steeds sneller
    if(bIn<6 && s%4===0) drum("kick",t);
    const every = bIn<2?8 : bIn<4?4 : bIn<6?2 : 1;
    if(s%every===0){ drum("snare",t); if(bIn>=6) drum("clap",t); }
    if(bIn===0 && s===0) riser(t,b16*16*8);
  }
  if(sec===0 && s%4===2) drum("hat",t);
  if((sec===1||sec===3) && s%2===0) drum("hat",t);
  if(sec===3 && s%4===2) drum("hat",t+b16*0.5);
  if(sec===3 && bIn===0 && s===0) crash(t);
  // bas
  if(sec===0 && s%2===0) tone(mtof(s%4===2?root+12:root),t,b16*1.5,"sawtooth",0.14,900);
  if(sec===1 && s%4===2) tone(mtof(root),t,b16*1.8,"sawtooth",0.18,700);
  if(sec===2 && s%4===0) tone(mtof(root),t,b16*3,"sawtooth",0.12,500+bIn*150);
  if(sec===3) tone(mtof(s%8===6?root+12:root),t,b16*0.9,"sawtooth",0.13,1200);
  // akkoorden
  if(sec===0 && [0,3,6,10].includes(s)) ch.forEach(m=>tone(mtof(m+12),t,b16*1.2,"sawtooth",0.03,2400));
  if(sec===1 && s===0) ch.forEach(m=>tone(mtof(m+12),t,b16*15,"triangle",0.045,1800));
  if(sec===3 && s%4===2) ch.forEach(m=>tone(mtof(m+12),t,b16*1.4,"sawtooth",0.035,3200));

    if(n!=null){ const tones=[ch[0],ch[1],ch[2],ch[0]+12,ch[1]+12]; tone(mtof(tones[n]+12),t,b16*1.6,sec===3?"square":"triangle",sec===3?0.04:0.06,3600); }
  }

function riser(t,dur){
  const a=actx, n=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  n.buffer=noise(); n.loop=true; f.type="bandpass"; f.Q.value=2;

  n.connect(f).connect(g).connect(musicBus); n.start(t); n.stop(t+dur+0.05);

function crash(t){
  const a=actx, n=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();

/* House 128: four-on-the-floor, open hats, pianoakkoorden en een groovende bas.
   Delen: groove -> piano en percussie -> break met opbouw (roffel en ruis) -> drop met hook en pompende akkoorden. */
const H_PROG=[[53,57,60,64],[55,59,62,65],[52,55,59,62],[57,60,64,67]];
const H_PIANO=[0,3,6,10,13], H_BASS=[[0,0],[3,7],[6,12],[8,0],[11,7],[14,10]];

const H_PERC=[3,7,11,14];
function houseStep(st,step,t){

  if(!brk || bIn>=6){ if(s%4===0 && !(brk && bIn===7 && s>=8)) drum("kick",t); }

/* Melodic 129 (naar het eerste deuntje): donker in F#-mineur met lange pad-akkoorden,
   four-on-the-floor kick en een rollende bas op de 16en tussen de kicks.
   Delen: intro met pad en opbouwende ruis -> groove -> heldere arpeggio-laag erbij -> piek met stop aan het eind. */
const M_PROG=[[54,57,61],[54,57,61],[54,57,61],[55,59,62],[49,52,56],[54,57,61],[47,50,54],[47,50,54]]; // F#m F#m F#m G C#m F#m Bm Bm

  // pad: elke maat een lang, zacht aanzwellend akkoord
  if(s===0 && !(sec===3 && bIn===7)) ch.concat([ch[0]+12]).forEach((m,k)=>{ tone(mtof(m),t,b16*16,"sawtooth",0.06,1500+(sec>=2?900:0),{detune:k%2?9:-9,att:0.35}); tone(mtof(m+12),t,b16*16,"triangle",0.02,0,{att:0.4}); });

  if(sec===3 && (s===4||s===12) && kickOn) drum("clap",t,0.6);

/* Tech house 124 (naar het tweede deuntje): diepe sub-bas op C die meepompt met de kick,

   Delen: groove -> plukjes erbij -> break zonder kick met opbouw -> alles met akkoordstoten. */
const T_PLUCK=[[0,0],[3,7],[6,4],[7,11],[10,6],[11,7],[14,12],[15,11]]; // stap, interval boven C (C E F# G B)
function techStep(st,step,t){

  // sub-bas: per tel een lange toon die na de kick weer opkomt (pompend)
  if(s%4===0){ tone(mtof(root),t+(kickOn?b16*0.6:0),b16*3.2,"sine",brk?0.14:0.2,0,{att:0.06}); tone(mtof(root+12),t+(kickOn?b16*0.6:0),b16*3.2,"triangle",0.1,0,{att:0.06}); }

  // break: roffel en ruis naar de drop
  if(brk){ if(bIn===2&&s===0) riser(t,b16*16*6); const ev=bIn<4?16:bIn<6?4:2; if(bIn>=2 && s%ev===0) drum("snare",t,0.3+bIn*0.08); }

  if((sec===3 && [0,6,10].includes(s)) || (sec===1 && s===6)) [0,4,7,11,18].forEach(iv=>tone(mtof(root+24+iv),t,b16*1.4,"sawtooth",0.035,2400,{detune:6}));

function scheduleStep(st,step,t){
  if(st.custom) return st.custom(st,step,t);
  const bar=Math.floor(step/16)%st.prog.length, s=step%16, ch=st.prog[bar], b16=60/st.bpm/4;
  if(st.kick&&st.kick.includes(s)) drum("kick",t);
  if(st.snare&&st.snare.includes(s)) drum("snare",t);
  if(st.clap&&st.clap.includes(s)) drum("clap",t);
  if(st.hat&&st.hat.includes(s)) drum("hat",t);
  const root=ch[0]-12;
  if(st.bass==="eighths" && s%2===0) tone(mtof(s%4===2?root+12:root),t,b16*1.6,st.bassWave,0.16,900);
  if(st.bass==="roots" && (s===0||s===8)) tone(mtof(root),t,b16*7,st.bassWave,0.3);
  if(st.bass==="quarters" && s%4===0) tone(mtof(root),t,b16*2.5,st.bassWave,0.07,1800);
  if(st.stab&&st.stab.includes(s)) ch.forEach(m=>tone(mtof(m+12),t,b16*1.2,st.stabWave,0.035,2400));
  if(st.pad&&s===0) ch.forEach(m=>tone(mtof(m),t,b16*15,"triangle",0.05,1400));
  if(st.arp){ const m=ch[s%ch.length]+(Math.floor(s/ch.length)%2?12:0)+12; tone(mtof(m),t,b16*0.8,"square",0.035,4000); }
}
function startMusic(style){
  stopMusic(); if(!MUSIC[style]||style==="off"||!prefs.sound) return;
  const a=ac(); if(!a) return;
  const st=MUSIC[style]; mus.style=style; mus.step=0; mus.next=a.currentTime+0.08;
  musicBus.gain.cancelScheduledValues(a.currentTime); musicBus.gain.setValueAtTime(0.0001,a.currentTime); musicBus.gain.exponentialRampToValueAtTime(musicLevel(),a.currentTime+0.6);
  mus.timer=setInterval(()=>{
    const b16=60/st.bpm/4;
    while(mus.next < actx.currentTime+0.15){
      const sw = st.swing && mus.step%2 ? b16*st.swing : 0;
      scheduleStep(st,mus.step,mus.next+sw); mus.next+=b16; mus.step++;
    }
  },30);
}

const musicLevel=()=>(ducked?0.25:1)*(restQuiet?0.55:1)*0.5*((MUSIC[mus.style]||{}).gain||1);

/* ---------- XP, levels en badges ---------- */
const TITLES=["Starter","Doorzetter","Spurter","Krachtpatser","Machine","Atleet","Kampioen","Legende"];
function xpOf(p){
  const t=todayKey(); let xp=0, run=0;
  const start=p.start||t, span=Math.max(0,daysBetween(start,t));
  for(let i=0;i<=span;i++){ const k=key(addDays(parse(start),i)); if(isDone(p,k)){ run++; xp+=100+10*Math.min(run,10); } else if(k!==t) run=0; }
  return xp;
}
function levelOf(xp){ // level n vanaf 250*(n-1)*n/2 XP
  let n=1; while(250*n*(n+1)/2<=xp) n++;
  const lo=250*(n-1)*n/2, hi=250*n*(n+1)/2;
  return {n, title:TITLES[Math.min(n-1,TITLES.length-1)], lo, hi, pct:(xp-lo)/(hi-lo)};
}
function badgesFor(p, sum, firstToday){
  const s=stats(p), out=[], h=new Date().getHours();
  const total=Object.values(p.days||{}).filter(Boolean).length;
  if(total===1) out.push(["Eerste stap","Je allereerste workout"]);
  for(const n of [3,7,14,30,50,100]) if(s.streak===n) out.push([`${n} op rij`,`${n} dagen achter elkaar`]);
  if(sum && sum.skipped===0) out.push(["Niets overgeslagen","Alle 12 oefeningen gedaan"]);
  if(h<8) out.push(["Vroege vogel","Voor 8 uur 's ochtends"]);
  if(h>=22) out.push(["Nachtbraker","Na 10 uur 's avonds"]);
  if(firstToday) out.push(["Eerste van de dag","Jij was vandaag de eerste"]);
  const mon=addDays(new Date(),-((new Date().getDay()+6)%7)); let wk=0; for(let i=0;i<7;i++) if(isDone(p,key(addDays(mon,i)))) wk++;
  if(wk===7) out.push(["Perfecte week","Maandag t/m zondag gedaan"]);
  return out;
}

/* ---------- timer ---------- */
let T=null, wakeLock=null;
async function openTimer(){
  if(T) return;
  ac();
  const b=document.querySelectorAll("[data-start]"); b.forEach(x=>{ x.disabled=true; });
  await Promise.race([loadClips(), new Promise(r=>setTimeout(r,4000))]);
  b.forEach(x=>{ x.disabled=false; });
  const list=todaysWorkout();
  const phases=[{type:"prep",i:0,dur:PREP}];
  list.forEach((ex,i)=>{ phases.push({type:"work",i,dur:WORK}); if(i<list.length-1) phases.push({type:"rest",i:i+1,dur:REST}); });
  T={list,phases,p:0,end:0,left:0,paused:false,lastSec:null,switched:false,halved:false,skipped:0,started:Date.now()};
  ac(); loadClips(); warmVoice();
  $("#timer").hidden=false;
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").then(l=>wakeLock=l).catch(()=>{}); }catch(e){}
  startMusic(prefs.music||"off");
  startPhase(0);
  T.iv=setInterval(tick,100);
}
function closeTimer(){
  if(T) clearInterval(T.iv); T=null; $("#timer").hidden=true; $("#timer").innerHTML="";
  try{ speechSynthesis.cancel(); }catch(e){}
  stopMusic(); restQuiet=false; ducked=false;
  setTimeout(()=>{ if(!T && !mus.timer) mediaMode(false); },4000);
  try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null;
}
function startPhase(n){
  T.p=n; const ph=T.phases[n]; T.end=Date.now()+ph.dur*1000; T.lastSec=null; T.switched=false; T.halved=false;
  const ex=T.list[ph.i];
  restQuiet = ph.type!=="work"; setMusicLevel();
  // bij de start alleen het deuntje; de naam van de oefening hoor je al in de rust ervoor
  const last=ph.i===T.list.length-1, nx=last?["last","ex-"+ex.id]:["next","ex-"+ex.id], nxText=(last?"Last one! ":"Next, ")+ex.en;
  if(ph.type==="work") startJingle();

  else playClips(["ready"].concat(nx),"Get ready! "+nxText);

}
function finish(){
  const sum={skipped:T?T.skipped:0, total:T?T.list.length:12, secs:T?Math.round((Date.now()-T.started)/1000):0, focus:(W.FOCUS[prefs.focus]||W.FOCUS.mix).label};
  closeTimer();
  beep(784,0.15); setTimeout(()=>beep(1046,0.15),160); setTimeout(()=>beep(1318,0.45),320);
  setTimeout(()=>cue("done"),500);
  const p=people.find(x=>x.id===me);
  if(!p){ toast("Goed gedaan! Kies je naam bovenaan om de workout af te vinken."); fireConfetti(); return; }
  if(isDone(p,todayKey())){ celebrate(sum,true); return; }
  markToday(sum);
}
function skipPhase(){
  if(!T) return; if(T.paused){ T.paused=false; }
  const ph=T.phases[T.p]; if(ph.type==="work" && T.end-Date.now()>5000) T.skipped++;

    T.lastSec=sec;

  else if("close" in b.dataset){ $("#celebrate").hidden=true; }
  else if(b.dataset.focus){ setPref("focus",b.dataset.focus); variant=0; renderToday(); }
  else if("nojump" in b.dataset){ setPref("nojump",!prefs.nojump); variant=0; renderToday(); }
  else if("remix" in b.dataset){ variant++; renderToday(); }
  else if(b.dataset.ex){ openDetail(b.dataset.ex); }
  else if("dclose" in b.dataset){ closeDetail(); }
  else if("tstop" in b.dataset){ closeTimer(); }
  else if("tpause" in b.dataset){ togglePause(); }
  else if("tskip" in b.dataset){ skipPhase(); }
  else if(b.dataset.music){ setPref("music",b.dataset.music); renderToday(); ac(); previewMusic(b.dataset.music); }
  else if("tmusic" in b.dataset){ cycleMusic(); }
  else if("tsound" in b.dataset){ setPref("sound",!prefs.sound); b.innerHTML=soundIcon(); b.setAttribute("aria-label",prefs.sound?"Geluid uit":"Geluid aan"); }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="joinform"){ e.preventDefault(); join($("#joinname").value); }
  if(e.target.id==="gateform"){ e.preventDefault(); groupCode=$("#gatecode").value.trim(); try{ localStorage.setItem("zmc-code",groupCode); }catch(_){} $("#gate").hidden=true; load(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(!$("#celebrate").hidden) $("#celebrate").hidden=true; else if(!$("#detail").hidden) closeDetail(); } });

/* ---------- boot ---------- */
let dbFailed=false;
render();
let loading=false, seenDone=null;
async function load(){
  if(loading || busy) return; loading=true;
  try{
    const list=await api("people");
    if(!busy){
      const t=todayKey(), now=new Set(list.filter(x=>isDone(x,t)).map(x=>x.id));
      if(seenDone){ for(const x of list) if(now.has(x.id) && !seenDone.has(x.id) && x.id!==me) toast(`${x.name} heeft net de workout gedaan. Jij ook al?`); }
      seenDone=now;
      people=list.sort((a,b)=>a.created-b.created); db=true; dbFailed=false; render();
    }
  }catch(e){ if(e.code!=="auth" && !db){ dbFailed=true; render(); } }
  loading=false;
}
load();
// Iedereen ziet elkaars vinkjes: ververs elke 20 seconden en als je terugkomt naar de pagina
setInterval(()=>{ if(document.visibilityState==="visible") load(); },20000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(); });
// Nieuwe dag na middernacht: opnieuw tekenen
let lastDay=todayKey(); setInterval(()=>{ if(todayKey()!==lastDay){ lastDay=todayKey(); render(); } },60000);
})();
</script>
